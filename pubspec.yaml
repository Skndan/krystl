name: krystl
description: "Expense budge tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Core Packages
  get_it: ^8.0.3
  provider: ^6.1.2
  flutter_svg: ^2.0.10+1
  path_provider: ^2.1.5
  shared_preferences: ^2.4.0
  mobile_scanner: ^6.0.3
  flutter_upi_india: ^0.0.6
  url_launcher: ^6.3.1
  uuid:

  # UI Packages
  shimmer: ^3.0.0
  siri_wave: ^2.2.0
  animate_do: ^3.3.4
  solar_icons: ^0.0.5
  auto_size_text: ^3.0.0
  flutter_blurhash: ^0.8.2

  # Network Packages
  dio: ^5.7.0
  connectivity_plus: ^6.1.2
  internet_connection_checker: ^3.0.1

  # Form Packages
  intl: ^0.19.0
  flutter_form_builder: ^9.7.0
  form_builder_validators: ^11.1.1

  # Misc Packages
  colorize: ^3.0.0
  rxdart: ^0.28.0

  # Security
  freerasp: ^6.11.0

  # Analytics
  firebase_crashlytics: ^4.3.1
  firebase_analytics: ^11.4.1

  # Authentication
  firebase_auth: ^5.4.1
  firebase_core: ^3.10.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.2
  flutter_colorpicker: ^1.1.0

  # Ads
  # google_mobile_ads: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/image/
    - assets/svg/
    - assets/lottie/

  fonts:
    - family: Urbanist
      fonts:
        - asset: fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: fonts/Urbanist-Bold.ttf
          weight: 700
        - asset: fonts/Urbanist-Black.ttf
          weight: 800
